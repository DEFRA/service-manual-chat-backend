[project]
name = "service-manual-chat-backend"
version = "0.1.0"
description = "service-manual-chat-backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.3.0",
    "dnspython==2.8.0",
    "ecs-logging==2.3.0",
    "fastapi==0.141.1",
    "httpx2==2.13.1",
    "pydantic-ai-slim[bedrock]==2.48.0",
    "pydantic-settings==2.15.0",
    "pymongo[aws,encryption,snappy,zstd]==4.18.1",
    "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.8",
    "taskipy==1.14.1",
]

[project.scripts]
run-evals = "evals.__main__:main"

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
lint = "uv run ruff format ./app ./evals ./scripts --check && uv run ruff check ./app ./evals ./scripts"
test = "uv run task lint && uv run pytest -vv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]
exclude = ["evals/results"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
# Same as Black
line-length = 88

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable a comprehensive set of rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
]

# Exclude a variety of commonly ignored directories
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
    "test_data",
    "coverage",
    "reports",
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore some rules
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "COM812", # missing trailing comma, conflicts with formatter
]

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
"app/**/test_*.py" = ["S101"]  # Allow assert in app test files
"scripts/test_*.py" = ["S101"]  # Allow assert in script test files
"evals/test_*.py" = ["S101"]  # Allow assert in evaluation test files

# Enable auto-fixing
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "motor", "pytest"]
known-first-party = ["app", "fetch_content"]

[tool.ruff.format]
# Like Black, use double quotes for strings
quote-style = "double"

# Like Black, indent with spaces, rather than tabs
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"


[tool.coverage.run]
source = ["app", "scripts"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"
