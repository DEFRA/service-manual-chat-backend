[project]
name = "service-manual-chat-backend"
version = "0.1.0"
description = "service-manual-chat-backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.5.0",
    "dnspython==2.9.2",
    "ecs-logging==2.3.0",
    "fastapi==0.163.2",
    "httpx==0.28.1",
    "pydantic-ai-slim[bedrock]==2.70.0",
    "pydantic-settings==2.16.3",
    "pymongo[aws,encryption,snappy,zstd]==4.20.0",
    "uvicorn==0.54.0",
]

[project.scripts]
service-manual-chat-backend = "app.entrypoints.fastapi:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.5",
    "taskipy==1.14.1",
]

# Upper bound must stay compatible with the `uv` version baked into the
# Dockerfile's FROM lines - check both when bumping either.
[build-system]
requires = ["uv_build>=0.10.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"
# Exempt from the cooldown so the trust bundle picks up the eMudhra CA removal
# (CAIT-330, https://discuss.python.org/t/109576).
exclude-newer-package = { certifi = false }

[tool.uv.build-backend]
module-name = "app"
module-root = ""
namespace = true

[tool.mypy]
mypy_path = "scripts"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
