# SonarCloud project: https://sonarcloud.io/project/overview?id=DEFRA_service-manual-chat-backend
# Set up following https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md
# The scan runs from the three workflows under .github/workflows and needs the
# SONAR_TOKEN repository secret.

sonar.projectKey=DEFRA_service-manual-chat-backend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/service-manual-chat-backend
sonar.links.ci=https://github.com/DEFRA/service-manual-chat-backend/actions
sonar.links.scm=https://github.com/DEFRA/service-manual-chat-backend
sonar.links.issue=https://github.com/DEFRA/service-manual-chat-backend/issues

# Tests sit next to the code as test_*.py, so sources and tests share the
# same folders and the inclusion patterns tell them apart.
sonar.sources=app/,scripts/
sonar.exclusions=**/test_*.py,app/ask/__fixtures__/**
sonar.tests=app/,scripts/
sonar.test.inclusions=**/test_*.py

sonar.python.version=3.14
# pytest-cov writes this; see pytest.ini
sonar.python.coverage.reportPaths=coverage.xml
